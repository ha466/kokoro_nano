[project]
name = "kokoro-teacher"
version = "0.1.0"
description = "Two-voice Kokoro teacher-data generation and student distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "attrs>=23.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "huggingface-hub>=0.20.0",
    "librosa>=0.10.0",
    "loguru>=0.7.0",
    "misaki[en]>=0.6.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "soxr>=0.3.0",
    "spacy>=3.8.0,<3.9.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
]

[dependency-groups]
dev = []

[tool.uv]
# Scripts are run directly from the checkout; this repository is not a
# distributable Python package.
package = false
